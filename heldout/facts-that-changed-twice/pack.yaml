      title: Sustainability Report 2023
      date: "2024-05-15"
      lang: en
      passages:
        - "In 2023, 70% of the electricity delivered at our charge points came from renewable sources."
    - doc_id: RF-2024
      title: Roaming Factsheet 2024
      date: "2024-09-10"
      lang: en
      passages:
        - "Roaming partners connect to us over OCPI 2.1.1."
        - "Plug & Charge (ISO 15118) is being piloted at 12 sites."
        - "Roaming invoices are payable within 60 days."
