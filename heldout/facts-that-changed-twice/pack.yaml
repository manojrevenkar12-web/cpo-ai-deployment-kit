      title: Capitolato tecnico – risposta tipo
      date: "2025-03-03"
      lang: it
      passages:
        - "Operiamo reti di ricarica pubbliche in 10 Paesi europei."
        - "Disponibilità tecnica garantita dei punti di ricarica in corrente continua: 98,5% su base mensile."
        - "La rete conta 540 siti di ricarica ad alta potenza (HPC)."
        - "Potenza erogabile fino a 350 kW per punto di ricarica."
        - "Garanzia hardware sulle colonnine: 5 anni."
