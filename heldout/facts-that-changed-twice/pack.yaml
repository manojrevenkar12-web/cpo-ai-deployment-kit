    - doc_id: BR-2024
      title: Corporate Brochure 2024
      date: "2024-02-12"
      lang: en
      passages:
        - "We run public charging networks in 9 European countries."
        - "Our DC fast chargers come with an availability commitment of 97%."
        - "If a fault cannot be fixed remotely, a service technician is on site within 48 hours."
        - "The driver hotline is open Monday to Saturday, 08:00–20:00."
