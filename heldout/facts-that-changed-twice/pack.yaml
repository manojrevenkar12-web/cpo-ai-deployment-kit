      passages:
        - "Se il guasto non è risolvibile da remoto, l'intervento del tecnico in loco avviene entro 24 ore."
        - "Il numero verde per i conducenti risponde tutti i giorni dalle 7 alle 22."
    - doc_id: SEC-2025
