name: facts-that-changed-twice
description: >
  A bid library of thirteen dated documents (2024 to mid-2026, English and Italian) in which ten
  facts changed twice: DC availability (97% -> 98,5% -> 99%), on-site response (48 h -> 24 ore ->
  12 h), countries (9 -> 10 Paesi -> 11), high-power sites (320 -> 540 -> 910), renewable share
  (70% -> 90% -> 100%), OCPI version (2.1.1 -> 2.2.1 -> 2.3.0), hotline hours (Mon-Sat 08-20 ->
  dalle 7 alle 22 -> 24/7), Plug & Charge (pilot at 12 sites -> 45% -> 80%), roaming payment terms
  (60 -> 45 -> 30 giorni) and maximum power per point (300 -> 350 -> 400 kW). The same fact is
  called availability, uptime or disponibilità tecnica; newer documents sometimes quote the older
  value ("up from 540"), and one newest document gives a separate AC figure next to the DC one.
  Questions come in English and Italian, and a third of them are not answered by the library,
  several of them near misses (OCPP instead of OCPI, measured instead of committed availability,
  penalties next to availability). Disputes, refunds and sites are of ordinary difficulty.
today: "2026-10-06"

