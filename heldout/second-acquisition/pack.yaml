        Sono state installate una colonnina HPC con 2 punti di ricarica CCS (Combo 2) da 150 kW
        ciascuno e una colonnina AC con 2 prese Tipo 2 da 22 kW. Potenza di connessione del sito:
        350 kW.

        Il sito è accessibile 24 ore su 24, 7 giorni su 7. Il pagamento ad-hoc con carta tramite
        lettore POS contactless integrato nella colonnina HPC è stato verificato e risulta
        funzionante.

        Esito: POSITIVO.
