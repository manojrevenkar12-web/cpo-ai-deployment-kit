        VERBALE DI COLLAUDO N. 2026/118 – Impianto EN-0201 "Lecce Tangenziale Est"

        In data 18/08/2026 il tecnico incaricato ha eseguito il collaudo dell'impianto di ricarica
        sito in Via Giuseppe Taranto 22, 73100 Lecce (LE). Coordinate rilevate con GPS sul posto:
