name: second-acquisition
description: >
  A second acquired Italian network (ElettroNord Servizi) exports its sites with its own column
  names and conventions: street and house number in separate columns, power in watts (sometimes
  typed as "300 kW", "50kW" or "150.000" with an Italian thousands dot), connector names such as
  CCS2, Combo2, Mennekes and Tipo 2, hours written as H24, 00-24, 6-22, "LUN-VEN 7.30-19.30" or
  "8-20 lun-sab; dom chiuso", coordinates as strings with N/E suffixes or prefixes, comma decimals,
  degrees-minutes-seconds, one pair typed into the wrong columns and one with a W suffix, payment
  written as S/N, Sì, contactless or "solo app", and a Rome postal code with a leading zero. Four
  sites exist only in free-text commissioning protocols. About two in five sites need a person.
  Disputes, refunds and tenders are of ordinary difficulty.
today: "2026-09-22"

