[project]
name = "cpo-ai-deployment-kit"
version = "0.1.0"
description = "Ship AI into a charge point operator's back office in sprints of under ten person-days: use cases with evals, access control, approvals, monitoring, and adoption and impact measured against a simulated organisation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "polars>=1.30",
  "numpy>=2.2",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.16",
  "fastapi>=0.118",
  "uvicorn>=0.35",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "mcp>=2.0",
  "agent-framework-core>=1.20",
  "microsoft-agents-hosting-core>=1.9",
  "microsoft-agents-activity>=1.9",
  "opentelemetry-sdk>=1.36",
  "psycopg[binary]>=3.2",
  "anthropic>=0.70",
  "microsoft-agents-hosting-aiohttp>=1.9",
  "microsoft-agents-authentication-msal>=1.9",
]

[project.scripts]
cpokit = "cpokit.cli:app"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "hypothesis>=6.135", "ruff>=0.13", "openapi-spec-validator>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: builds a world and runs the deployment", "db: needs PostgreSQL (CPOKIT_TEST_DATABASE_URL)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/cpokit/sim/texts.py" = ["E501"]
"src/cpokit/sim/tenders.py" = ["E501"]
"src/cpokit/llm/simreader.py" = ["E501"]
"tests/*" = ["RUF059"]
